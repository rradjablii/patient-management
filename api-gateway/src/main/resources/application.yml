server:
  port: 4003

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: patient-service-route
              uri: http://patient-service:4000
              predicates:
                - Path=/api/v1/patients/**
              filters:
                - RewritePath=/api-docs/v1/patients, /v3/api-docs/patient-service
            - id: auth-service-route
              uri: http://auth-service:4005
              predicates:
                - Path=/api/v1/auth/**
              filters:
                - RewritePath=/api-docs/v1/auth, /v3/api-docs/auth-service