spring.application.name=patient-service

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/patientdb}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:patient}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:patient}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# SQL init
spring.sql.init.mode=always

logging.level.root=info

# Server
server.port=${SERVER_PORT:4000}

    //gRPC
    grpc.server.port=${GRPC_SERVER_PORT:9001}
    grpc.server.address=${GRPC_SERVER_ADDRESS:localhost}


# Apche/Kafka
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.ByteArraySerializer

