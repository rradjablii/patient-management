services:
  postgres:
    image: postgres:16-alpine
    container_name: patient-postgres
    environment:
      POSTGRES_DB: patientdb
      POSTGRES_USER: patient
      POSTGRES_PASSWORD: patient
    volumes:
      - patient-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patient -d patientdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth-postgres:
    image: postgres:16-alpine
    container_name: auth-postgres
    environment:
      POSTGRES_DB: authdb
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
    volumes:
      - auth-postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d authdb"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  billing-service:
    build:
      context: ./billing-service
    container_name: billing-service
    depends_on:
      kafka:
        condition: service_started
    environment:
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
    ports:
      - "4001:4001"
      - "9001:9001"

  auth-service:
    build:
      context: ./auth-service
    container_name: auth-service
    depends_on:
      auth-postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://auth-postgres:5432/authdb
      SPRING_DATASOURCE_USERNAME: auth
      SPRING_DATASOURCE_PASSWORD: auth
      SPRING_JPA_HIBERNATE_DDL-AUTO: update
      SPRING_SQL_INIT_MODE: always
      JWT_SECRET: d3w4taxJB2qqTGa03FX56zaBcTs5cpQnsOFP9UkF/KI=

  patient-service:
    build:
      context: ./patient-service
    container_name: patient-service
    depends_on:
      postgres:
        condition: service_healthy
      billing-service:
        condition: service_started
      kafka:
        condition: service_started
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/patientdb
      SPRING_DATASOURCE_USERNAME: patient
      SPRING_DATASOURCE_PASSWORD: patient
      BILLING_SERVICE_ADDRESS: billing-service
      BILLING_SERVICE_GRPC_PORT: 9001
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092
    ports:
      - "4000:4000"

  analytics-service:
    build:
      context: ./analytics-service
    container_name: analytics-service
    depends_on:
      postgres:
        condition: service_healthy
      billing-service:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "4002:4002"
    environment:
      SPRING_KAFKA_BOOTSTRAP-SERVERS: kafka:9092

  api-gateway:
    build:
      context: ./api-gateway
    container_name: api-gateway
    depends_on:
      patient-service:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      AUTH_SERVICE_URL: http://auth-service:4005
    ports:
      - "4003:4003"

volumes:
  patient-postgres-data:
  kafka-data:
  auth-postgres-data: